<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome Aboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Doto:wght@100..900&family=Jost:wght@200..500&family=Inter+Tight:ital,wght@0,300..800;1,400..600&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&family=Gochi+Hand&family=Michroma&display=swap">
<style>
/* Layout: sketch 1 as a full-screen page. The stage is a size container; every position is a share of it, measured from
   Eileen's sketches. Tickets and wallet cards follow her wireframes; WELCOME ABOARD and the ticket names are set in Doto,
   a dot-matrix face, picked in the type and ticket lab. Look: white paper, ink, mono
   microtype, one color per project (a quiet take on Persona 3 / Hypergryph UI). Deliberately light-only. */
:root {
  --paper: #ffffff; --ink: #111214; --mute: #6f7279; --line: rgb(17 18 20 / .12);
  --file: #f1f2f5; --receipt: #fbfbf9;
  --f-word: "Jost", "Futura", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --f-dot: "Doto", ui-monospace, Menlo, monospace;
  --f-disp: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-sans: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --f-serif: "Instrument Serif", "Times New Roman", serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --f-hand: "Gochi Hand", "Comic Sans MS", cursive;
  --ease: cubic-bezier(.7, 0, .2, 1); --out: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.2, .9, .3, 1.15);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-sans); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.mono { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; line-height: 1.35; }
.bars { background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 4px, currentColor 4px 5px, transparent 5px 8px, currentColor 8px 11px, transparent 11px 13px); background-size: 26px 100%; }
.art { background-color: var(--c1); color: var(--c2); position: relative; overflow: hidden; }
.art::before { content: ""; position: absolute; inset: 0; }
.art-a::before { background: repeating-radial-gradient(circle at 72% 72%, var(--c2) 0 5px, transparent 5px 15px); }
.art-b::before { background: repeating-linear-gradient(-32deg, var(--c2) 0 9px, transparent 9px 24px); }
.art-c::before { background: radial-gradient(circle at 30% 38%, var(--c2) 0 28%, transparent 28.5%), linear-gradient(transparent 62%, var(--c2) 62% 66%, transparent 66%); }
.art-d::before { background: radial-gradient(var(--c2) 2.2px, transparent 2.6px) 0 0 / 13px 13px; }

/* ---------- stage + header ---------- */
.stage { position: relative; height: 100%; min-height: 540px; overflow: clip; background: var(--paper); container-type: size; }
.hd { position: absolute; top: 4.6cqh; left: 3.4cqw; right: 3.4cqw; display: flex; justify-content: space-between; align-items: baseline; z-index: 20; }
.hd nav, .pg-nav { display: flex; gap: 2.4cqw; font-size: clamp(11px, 1cqw, 13px); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.hd nav button, .pg-nav button { color: var(--mute); transition: color .2s; display: flex; gap: .4em; align-items: baseline; }
.hd nav button::before, .pg-nav button::before { content: "●"; font-size: .6em; opacity: 0; }
.hd nav button:hover, .hd nav button[aria-current="true"], .pg-nav button:hover, .pg-nav button[aria-current="true"] { color: var(--ink); }
.hd nav button[aria-current="true"]::before, .pg-nav button[aria-current="true"]::before { opacity: 1; }

/* ---------- the window block ---------- */
.wb { --cx: calc(50cqw + var(--wh) * .009); --cy: 47cqh; --wh: 43cqh; --ws: calc(var(--wh) * .688); position: absolute; width: var(--ws); height: var(--wh); left: calc(var(--cx) - var(--ws) / 2); top: calc(var(--cy) - var(--wh) / 2); }
.w-slot { position: absolute; inset: -6% -12%; }
.w-slot canvas { width: 100% !important; height: 100% !important; display: block; }
.w-word { position: absolute; z-index: 3; overflow: hidden; pointer-events: none; font-family: var(--f-dot); font-weight: 700; font-size: calc(var(--wh) * .29); line-height: .86; letter-spacing: 0; text-transform: uppercase; white-space: nowrap; padding: .06em .04em .04em; color: var(--ink); }
.w-mask { position: absolute; z-index: 4; left: calc(var(--ws) * .0724); top: calc(var(--wh) * .0646); width: calc(var(--ws) * .7992); height: calc(var(--wh) * .8414); clip-path: polygon(64.9% 9.7%, 71.7% 9.2%, 78.3% 8.4%, 84.4% 7.5%, 89.7% 6.7%, 94.1% 10.2%, 97.3% 14.2%, 99.3% 18.5%, 100% 23%, 100% 77%, 99.3% 81.5%, 97.3% 85.8%, 94.1% 89.8%, 89.7% 93.3%, 84.4% 96.1%, 78.3% 98.3%, 71.7% 99.6%, 64.9% 100%, 35.1% 100%, 28.3% 99.6%, 21.7% 98.3%, 15.6% 96.1%, 10.3% 93.3%, 5.9% 89.8%, 2.7% 85.8%, 0.7% 81.5%, 0% 77%, 0% 23%, 0.7% 18.5%, 2.7% 14.2%, 5.9% 10.2%, 10.3% 6.7%, 15.6% 5.8%, 21.7% 7%, 28.3% 8.1%, 35.1% 8.9%, 41.1% 9.5%, 47.1% 9.8%, 53.1% 9.9%, 59.1% 9.9%, 63.1% 9.7%); overflow: hidden; pointer-events: none; }
.w-mask-in { position: absolute; left: calc(var(--ws) * -.0724); top: calc(var(--wh) * -.0646); width: var(--ws); height: var(--wh); }
.w-mask .w1 { color: var(--ov1, #fff); transition: color .6s; }
.w-mask .w2 { color: var(--ov2, #2c5cc0); transition: color .6s; }
.w-word, .w-mask { display: none; }   /* the words over the window are off for now (2026-10-14); delete this line to bring them back */
.w-word .ch { display: inline-block; will-change: transform; }
.w1 { left: calc(var(--ws) * -.828); top: calc(var(--wh) * -.035); }
.w2 { right: calc(var(--ws) * -.805); bottom: calc(var(--wh) * .02); }
.w-tag { position: absolute; z-index: 5; left: calc(var(--ws) * .78); top: calc(var(--wh) * .21); height: calc(var(--wh) * .072); min-width: calc(var(--ws) * .66); background: var(--ink); color: #fff; padding: 0 .9em; display: flex; align-items: center; justify-content: space-between; gap: 1em; font-family: var(--f-mono); font-size: clamp(10px, calc(var(--wh) * .034), 13px); letter-spacing: .02em; white-space: nowrap; clip-path: inset(0 100% 0 0); transition: clip-path .5s var(--ease); }
.w-tag::after { content: ""; width: .9em; height: .9em; border-right: 1.5px solid #fff; border-top: 1.5px solid #fff; transform: rotate(45deg) translate(-2px, 2px); }
.w-tag.on { clip-path: inset(0 0 0 0); }

/* ---------- boarding pass: the stub you keep, torn along the perforation on its left edge. Inside, the ticket wireframe
   (type and date, name and mark, the role tab, description, preview); the stub carries the flight. White until hovered ---------- */
.deck { position: absolute; left: 0; right: 0; bottom: 0; height: 0; z-index: 6; }
.dslot { --tw: 16cqw; --th: calc(16cqw * 1.7); --pk: calc(var(--th) * .235 + var(--dp, 0px)); --up: min(calc(var(--th) * .72), 31cqh); position: absolute; left: var(--x); bottom: calc(var(--pk) - var(--th)); rotate: var(--r, 0deg); transition: translate .6s var(--spring), rotate .45s; filter: drop-shadow(0 1px 1px rgb(0 0 0 / .14)) drop-shadow(0 -2px 12px rgb(0 0 0 / .12)); }
.dslot:hover, .dslot:focus-within { translate: 0 calc(var(--pk) - var(--up)); rotate: 0deg; z-index: 6; }
.tk { --nr: calc(var(--tw) * .045); --pp: calc(var(--tw) * .062); position: relative; display: block; width: var(--tw); height: var(--th); container-type: size; isolation: isolate; overflow: hidden; border-radius: 0 6.5% 6.5% 0 / 0 3.8% 3.8% 0; background: var(--paper); color: var(--ink); text-align: left; transition: color .4s;
  -webkit-mask: radial-gradient(circle calc(var(--pp) * .28) at 0 50%, #0000 96%, #000) 0 50% / 100% var(--pp) repeat-y, radial-gradient(circle var(--nr) at 100% 75.5%, #0000 97%, #000); -webkit-mask-composite: source-in;
  mask: radial-gradient(circle calc(var(--pp) * .28) at 0 50%, #0000 96%, #000) 0 50% / 100% var(--pp) repeat-y, radial-gradient(circle var(--nr) at 100% 75.5%, #0000 97%, #000); mask-composite: intersect; }
.tk::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--t1); transform: scaleY(0); transform-origin: 50% 0; transition: transform .55s var(--ease); }
.tk.on { color: var(--ton); }
.tk.on::before { transform: none; }
.tk-hd { position: absolute; left: 7.4cqw; right: 5.8cqw; top: 2.1cqh; display: flex; justify-content: space-between; gap: 3cqw; font-family: var(--f-mono); font-size: 5.5cqw; line-height: 1; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.tk-hd::after { content: ""; position: absolute; left: -2.6cqw; right: -4.4cqw; top: 4.4cqh; border-top: 1px dashed currentColor; opacity: .6; }
.tk-name { position: absolute; left: 7.6cqw; top: 8.3cqh; font-family: var(--f-dot); font-weight: 900; font-size: 13.7cqw; line-height: 1.02; letter-spacing: 0; text-transform: uppercase; white-space: nowrap; }
.tk-mark { position: absolute; right: 5.8cqw; top: 8.3cqh; height: calc(21.4cqh - var(--nup, 0cqh)); width: auto; aspect-ratio: 32 / 66; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.4; }
.tk-mark .f { fill: currentColor; stroke: none; }
.tk-rule { position: absolute; left: 7.6cqw; right: 5cqw; top: calc(29.7cqh - var(--nup, 0cqh)); border-top: 1px solid currentColor; }
.tk-role { position: absolute; left: 8cqw; top: calc(26.1cqh - var(--nup, 0cqh)); height: 3.6cqh; min-width: 56cqw; padding: 0 2.6cqw; display: flex; align-items: center; background: currentColor; font-family: var(--f-mono); font-size: max(8px, 4.6cqw); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.tk-role span { color: var(--paper); transition: color .4s; }
.tk.on .tk-role span { color: var(--t1); }
.tk-desc { position: absolute; left: 8.4cqw; right: 8.8cqw; top: calc(32.6cqh - var(--nup, 0cqh)); font-size: max(10px, 5.8cqw); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tk-prev { position: absolute; left: 9cqw; right: 6.9cqw; top: calc(45.1cqh - var(--nup, 0cqh)); height: calc(24.7cqh + var(--nup, 0cqh)); border-radius: 1.4cqw; filter: grayscale(1); opacity: .5; transition: filter .5s .1s, opacity .5s .1s; }
.tk.on .tk-prev { filter: none; opacity: 1; }
.tk-stub { position: absolute; left: 0; right: 0; bottom: 0; height: 24.5cqh; transition: background-color .4s, color .4s; }
.tk-stub::after { content: ""; position: absolute; left: 5cqw; right: 0; top: -1px; border-top: 1.5px dashed currentColor; opacity: .55; }
.tk.on .tk-stub { background-color: var(--t2); color: var(--son); }
.st-f { position: absolute; inset: 4cqw 6cqw 4.4cqw 8.4cqw; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 2cqw; }
.sf-h { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 3.6cqw; letter-spacing: .14em; line-height: 1.2; text-transform: uppercase; }
.sf-codes { display: flex; align-items: center; gap: 2.6cqw; font-family: var(--f-disp); font-weight: 800; font-stretch: 112%; font-size: 10.5cqw; line-height: 1; }
.sf-codes i { position: relative; flex: 1; border-top: 2px dotted currentColor; }
.sf-codes i::after { content: ""; position: absolute; right: -2px; top: -4.5px; border-left: 6px solid currentColor; border-block: 3.5px solid transparent; }
.st-f .pdf { display: block; width: 100%; height: 100%; min-height: 0; fill: currentColor; }

/* ---------- project pop-up ---------- */
.mdl { position: absolute; inset: 0; z-index: 70; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; padding: 24px; }
.mdl-back { position: absolute; inset: 0; background: rgb(255 255 255 / .7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fade .3s; }
@keyframes fade { from { opacity: 0; } }
.mdl-card { position: relative; width: min(1120px, 100%); height: min(760px, 100%); display: grid; filter: drop-shadow(0 0 .7px rgb(17 18 20 / .85)) drop-shadow(0 26px 34px rgb(0 0 0 / .2)); animation: pop .5s var(--out); }
/* the sheet is the whole boarding pass: the ticket's perforated left edge, rounded right corners and the notch where the stub tears off */
.mc-pass { --pp: 18px; --sh: 70px; position: relative; display: grid; grid-template-rows: minmax(0, 1fr) var(--sh); min-height: 0; overflow: hidden; border-radius: 0 16px 16px 0; background: var(--paper); color: var(--ink); font-family: var(--f-sans); font-size: 15px; line-height: 1.5;
  -webkit-mask: radial-gradient(circle 4.5px at 0 50%, #0000 96%, #000) 0 50% / 100% var(--pp) repeat-y, radial-gradient(circle 13px at 100% calc(100% - var(--sh)), #0000 97%, #000); -webkit-mask-composite: source-in;
  mask: radial-gradient(circle 4.5px at 0 50%, #0000 96%, #000) 0 50% / 100% var(--pp) repeat-y, radial-gradient(circle 13px at 100% calc(100% - var(--sh)), #0000 97%, #000); mask-composite: intersect; }
@keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.98); } }
.mdl-card:focus { outline: none; }
.mdl-x { position: absolute; top: 14px; right: 14px; z-index: 5; font-size: 16px; width: 32px; height: 32px; background: var(--paper); border: 1px solid rgb(0 0 0 / .2); display: grid; place-items: center; }
/* reading order: text on the left, top to bottom; one picture on the right for the open step. Two faces: Inter Tight to read, Geist Mono for labels */
.mc-k, .mc-hd, .mc-facts dt, .mc-steps button span, .mc-view figcaption, .mc-inline figcaption { font-family: var(--f-mono); font-size: 10.5px; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.mc-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
.mc-text { position: relative; overflow-y: auto; padding: 22px 36px 18px; }
/* a dark panel (Dreamin's night): light captions and edges */
.dk .mc-view figcaption { color: rgb(238 241 255 / .6); }
.dk .wide .mc-shots img { box-shadow: 0 0 0 1px rgb(255 255 255 / .12); }
.mc-text p { margin: 0; }
.mc-text b { font-weight: 600; }
.mc-hd { position: relative; display: flex; justify-content: space-between; padding-bottom: 8px; margin-bottom: 14px; color: var(--ink); }
.mc-hd::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px dashed currentColor; opacity: .6; }
.mc-name { margin: 0 0 10px; font-family: var(--f-dot); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: 0; text-transform: uppercase; }
.mc-lede { font-size: 16px; line-height: 1.45; }
.mc-facts { margin: 14px 0 0; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 5px 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
.mc-facts dt { padding-top: 3px; }
.mc-facts dd { margin: 0; }
.mc-facts a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.mc-facts a:hover { text-decoration-thickness: 2px; }
.mc-meta, .mc-mute, .mc-why { color: var(--mute); }
.mc-meta { font-size: 13.5px; margin-top: 2px !important; }
.mc-why { font-size: 13.5px; }
.mc-text .mc-k { margin: 20px 0 6px; }
.mc-pain { font-weight: 500; }
.mc-steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.mc-steps li { border-bottom: 1px solid var(--line); }
.mc-steps button { width: 100%; display: flex; align-items: baseline; gap: 14px; padding: 8px 0; color: var(--mute); transition: color .2s; }
.mc-steps button span { width: 18px; flex: none; }
.mc-steps button:hover, .mc-steps li.on button { color: var(--ink); }
.mc-steps li.on button { font-weight: 600; }
.mc-steps button i { margin-left: auto; position: relative; width: 10px; height: 10px; flex: none; align-self: center; }
.mc-steps button i::before, .mc-steps button i::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid currentColor; }
.mc-steps button i::after { transform: rotate(90deg); transition: transform .2s; }
.mc-steps li.on button i::after { transform: none; }
.mc-detail { display: none; gap: 6px; padding: 0 0 14px 32px; }
.mc-steps li.on .mc-detail { display: grid; }
.mc-inline { display: none; }
/* the picture panel: the right half of the pass */
.mc-view { position: absolute; top: 0; bottom: 0; right: 0; left: 50%; z-index: 3; display: grid; overflow: hidden; background: var(--pv, #f0efeb); }
.mc-view > figure { display: none; grid-template-rows: minmax(0, 1fr) auto; gap: 14px; margin: 0; padding: 56px 40px 24px; min-height: 0; }
.mc-view > figure.on { display: grid; animation: fade .5s; }
.mc-view > figure.bleed { padding: 0; grid-template-rows: minmax(0, 1fr); }
.bleed .mc-shots { display: block; position: relative; height: 100%; }
.bleed .mc-shots img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bleed figcaption, .collage figcaption { display: none; }
/* a hand-placed collage of screens on a soft tint */
.mc-view > figure.collage { container-type: size; padding: 0; grid-template-rows: minmax(0, 1fr); background: linear-gradient(160deg, #f4f0ff, #e2d9fa); }
/* the screens sit in a 3:4 frame centred in the panel, every one inside a 5% margin, so it scales as one piece */
.collage .mc-shots { display: block; position: relative; width: min(100cqw, 75cqh); height: auto; aspect-ratio: 3 / 4; margin: auto; }
.collage .mc-shots img { position: absolute; height: auto; border-radius: 8px; box-shadow: 0 20px 40px -20px rgb(40 20 90 / .45), 0 0 0 1px rgb(0 0 0 / .05); }
/* two wide screens stack */
.wide .mc-shots { flex-direction: column; }
.wide .mc-shots img + img { max-height: calc(50% - 10px); }
.wide .mc-shots img:has(+ img) { max-height: calc(50% - 10px); }
/* style cards as the app's polaroids: the picture, its tag and level, and a progress bar */
.pols .mc-shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-content: center; gap: 14px; }
.pol { display: grid; gap: 5px; padding: 7px 7px 9px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .12), 0 6px 14px -8px rgb(0 0 0 / .25); }
.pol img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.pol p { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; }
.pol p span { overflow: hidden; text-overflow: ellipsis; }
.pol small { font-size: 10px; color: var(--mute); }
.pol i { height: 4px; background: linear-gradient(var(--ink), var(--ink)) 0 0 / var(--p) 100% no-repeat, #e4e4e1; }
.mc-shots { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 0; }
.phone .mc-shots img { width: auto; height: auto; max-width: calc(50% - 10px); max-height: min(100%, 560px); min-width: 0; object-fit: contain; border-radius: 16px; box-shadow: 0 24px 40px -26px rgb(0 0 0 / .5), 0 0 0 1px rgb(0 0 0 / .05); }
.wide .mc-shots img { width: 100%; height: auto; max-height: 100%; object-fit: contain; box-shadow: 0 0 0 1px var(--line); }
.art .mc-shots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-content: center; gap: 10px; }
.rows .mc-shots { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.rows .row { display: flex; justify-content: center; gap: 10px; min-height: 0; }
.rows .row img { flex: 0 1 auto; min-width: 0; max-width: 100%; max-height: 300px; object-fit: contain; }
.rows .row img:only-child { width: 100%; height: auto; }
.rows .row img:not(:only-child) { width: calc((100% - 40px) / 5); height: auto; }
.art .mc-shots img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.art.cut .mc-shots img { object-fit: contain; padding: 10px; background: #f8f4ea; }
.mc-view figcaption, .mc-inline figcaption { text-align: center; }
.mc-ph { min-height: 100%; }
/* the stub: torn along a dashed line, in the ticket's stub colours, carrying the route, the barcode and the next flight */
.mc-stub { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 24px; padding: 0 28px 0 32px; background: var(--t2); color: var(--son); }
.mc-stub::before { content: ""; position: absolute; left: 0; right: 0; top: 0; border-top: 1.5px dashed var(--ink); opacity: .55; }
.mc-stub .mc-k { color: inherit; opacity: .75; }
.mc-route { display: grid; gap: 2px; justify-items: center; }
.mc-route b { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; letter-spacing: .02em; line-height: 1; }
.mc-route i { position: relative; width: 80px; border-top: 2px dotted currentColor; }
.mc-route i::after { content: ""; position: absolute; right: -2px; top: -4.5px; border-left: 6px solid currentColor; border-block: 3.5px solid transparent; }
.mc-home { font-weight: 500; }
.mc-home:hover { text-decoration: underline; text-underline-offset: 4px; }
.mc-go { display: flex; gap: 8px; }
.mc-next { background: var(--son); color: var(--t2); padding: 9px 16px; font-weight: 600; }

/* ---------- pages (open over the landing view) ---------- */

const MARK = {

// a stacked (PDF417-like) barcode, drawn from a seed so each project keeps its own
function pdfSVG(seed) {
  const r = rnd(seed * 17 + 3); let d = "M0 0h2v23h-2zM98 0h2v23h-2z";
  for (let row = 0; row < 4; row++) { let x = 4; while (x < 95) { const w = 1 + (r() * 3 | 0); if (r() < .56) d += `M${x} ${row * 6}h${Math.min(w, 95 - x)}v5h-${Math.min(w, 95 - x)}z`; x += w + (r() < .5 ? 1 : 0); } }
  return `<svg class="pdf" viewBox="0 0 100 23" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true"><path d="${d}"/></svg>`;
}
// a ticket name sets one line per entry; names longer than seven letters shrink to fit beside the mark
const tkLines = p => p.lines || p.title.split(" ");
const tkName = p => { const l = tkLines(p), n = Math.max(...l.map(x => x.length)); return `<span class="tk-name"${n > 7 ? ` style="font-size:${(13.7 * 7 / n).toFixed(2)}cqw"` : ""}>${l.join("<br>")}</span>`; };
// a project's picture: its own screens when it has them, the placeholder pattern otherwise
const prevHTML = (p, cls) => !p.prev ? `<span class="${cls} art art-${p.art}" style="${artVars(p)}"></span>`
  : `<span class="${cls} shot${p.prev.length > 1 ? " phones" : ""}">${p.prev.map(x => `<img src="${x}" alt="" decoding="async"${p.zoom ? ` style="transform:scale(${p.zoom[0]});transform-origin:${p.zoom[1]}"` : ""}>`).join("")}</span>`;

let cur = "~";
function focus(id) {
  if (id === cur) return; cur = id;
  const p = P.find(x => x.id === id);
  st.querySelectorAll(".deck .tk").forEach(v => v.classList.toggle("on", v.dataset.p === id));
  W3 && W3.setScene(p ? p.scene : "sky");
  const [a, ...rest] = p ? (p.hero || p.title.toUpperCase().split(" ")) : ["WELCOME", "ABOARD"];
  pixelWord([...st.querySelectorAll(".w1")], a);
  pixelWord([...st.querySelectorAll(".w2")], rest.join(" ") || a);
  const tag = st.querySelector(".w-tag");
  if (p) { tag.classList.add("on"); scramble(tag.querySelector(".tagt"), `EZ${p.n} · ${p.code}`); } else tag.classList.remove("on");
  const ov = OV[p ? p.scene : "sky"]; st.style.setProperty("--ov1", ov[0]); st.style.setProperty("--ov2", ov[1]);

const covered = () => !st.querySelector(".mdl").hidden || !st.querySelector(".pg").hidden;
st.addEventListener("pointerover", e => { if (covered()) return; const t = e.target.closest("[data-p]"); focus(t ? t.dataset.p : ""); });

st.addEventListener("focusin", e => { const t = e.target.closest("[data-p]"); if (t && !covered()) focus(t.dataset.p); });
st.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-replay]")) { try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {} location.reload(); return; }
  if (t.closest("[data-mclose]")) { closeModal(); return; }
  const sp = t.closest("[data-step]");
  if (sp) { const card = sp.closest(".mdl-card"); stopTour(); showStep(card, sp.parentElement.classList.contains("on") ? 0 : +sp.dataset.step); return; }
  if (t.closest("[data-home]")) { closePage(); return; }
  const pb = t.closest("[data-page]"); if (pb) { openPage(pb.dataset.page); return; }
  const wc = t.closest("[data-wcard]"); if (wc) { if (wc.dataset.wcard !== wSel) selectWallet(wc.dataset.wcard, true); return; }
  const th = t.closest("[data-th]"); if (th) { const [eid, i] = th.dataset.th.split(":"); openLB(eid, +i); return; }
  const o = t.closest("[data-open]"); if (o) openModal(o.dataset.open);
});

let wSel = "e1";

  file.animate([{ opacity: 0, translate: "0 8px" }, { opacity: 1, translate: "0 0" }], { duration: reduce ? 1 : 420, easing: "cubic-bezier(.16,1,.3,1)" });
}
const WALLET_HTML = () => `<div class="page">

/* lightbox */
let lbState = null;
const lb = $("lb");
function openLB(eid, i) {
  const e = E.find(x => x.id === eid), t = thumbStyle(e, i);
  lbState = { eid, i };
  lb.innerHTML = `<div class="lb-top mono"><span>${e.title} · ${pad(i + 1)} / ${pad(e.imgs)}</span><button data-lbclose aria-label="Close viewer">×</button></div>
    <div class="lb-stage"><button data-lbnav="-1" aria-label="Previous piece">←</button>
      <div class="lb-img art art-${t.cls}" style="${t.style};aspect-ratio:${t.ar}" role="img" aria-label="${e.title}, piece ${i + 1}"></div>
      <button data-lbnav="1" aria-label="Next piece">→</button></div>
    <div class="lb-bot mono"><span>Placeholder caption: client, date, one line of context</span>
      <div class="lb-strip">${Array.from({ length: e.imgs }, (_, j) => { const s = thumbStyle(e, j); return `<button class="art art-${s.cls}" style="${s.style}" data-lbgo="${j}" aria-label="Piece ${j + 1}" aria-current="${j === i}"></button>`; }).join("")}</div></div>`;
  lb.hidden = false; lb.querySelector("[data-lbclose]").focus({ preventScroll: true });
}
function closeLB() { if (lb.hidden) return false; lb.hidden = true; lb.innerHTML = ""; lbState = null; return true; }
function navLB(d) { const e = E.find(x => x.id === lbState.eid); openLB(e.id, (lbState.i + d + e.imgs) % e.imgs); }
document.addEventListener("click", e => {
  if (!lbState) return;
  const t = e.target;
  if (t.closest("[data-lbclose]") || t === lb) { closeLB(); return; }
  const ln = t.closest("[data-lbnav]"); if (ln) { navLB(+ln.dataset.lbnav); return; }
  const lg = t.closest("[data-lbgo]"); if (lg) openLB(lbState.eid, +lg.dataset.lbgo);
});

/* ---------------- pages ---------------- */

const pg = st.querySelector(".pg");
function setHash(h) { try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (_) {} }
function closePage() { if (pg.hidden) return false; pg.hidden = true; pg.innerHTML = ""; setHash(""); return true; }
function openPage(view) {
  closePage(); closeModal(); closeLB();
  if (view === "home") return;

  pg.innerHTML = pageBar(view) + (view === "wallet" ? WALLET_HTML() : ID_HTML);

      card.style.setProperty("--ry", (x * 14).toFixed(2) + "deg"); card.style.setProperty("--rx", (-y * 12).toFixed(2) + "deg"); card.style.setProperty("--sh", (x * 120).toFixed(0) + "%"); });
    card.addEventListener("pointerleave", () => { card.style.setProperty("--ry", "0deg"); card.style.setProperty("--rx", "0deg"); card.style.setProperty("--sh", "-40%"); });
  }
  pg.querySelector(".hd-logo").focus({ preventScroll: true });
}

/* ---------------- pop-up: the whole case study in one sheet, with the next flight always in reach ---------------- */
const mdl = st.querySelector(".mdl");
function caseBody(p) {
  const c = CS[p.id], img = (src, alt) => `<img src="${src}" alt="${alt}" decoding="async">`;
  const head = `<div class="mc-hd"><span>${p.kind}</span><span>${p.date}</span></div><h3 class="mc-name">${p.long || (p.lines || [p.title]).join(" ")}</h3>`;
  const facts = f => `<dl class="mc-facts">${f.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
  if (!c) return `<div class="mc-text">${head}<p class="mc-lede">${p.desc}</p>${facts([["Role", p.role], ["Type", p.kind], ["Date", p.date]])}
      <h4 class="mc-k">Case study</h4><p>Placeholder. Coming soon.</p></div>
    <div class="mc-view"><figure class="on mc-ph art art-${p.art}" style="${artVars(p)}"></figure></div>`;
  const shots = (v, cls) => `<figure class="${cls}"><div class="mc-shots">${v.shots.map(([l, src, at]) => at ? img(src, l).replace("<img ", `<img style="${at}" `) : img(src, l)).join("")}</div><figcaption>${v.shots.map(([l]) => l).join(" · ")}</figcaption></figure>`;
  // the picture panel: the cover that sets the mood, then one picture per step, then the visual work
  // the extra visual work: the app's polaroids, a grid of cut-out drawings, or rows of sheets
  const extra = ({ step, view: v }) => v.kind === "polaroid"
      ? `<figure class="pols"><div class="mc-shots">${v.items.map(([src, l, lv, pc]) => `<div class="pol">${img(src, `#${l}`)}<p><span>#${l}</span><small>lv.${lv}</small></p><i style="--p:${pc}%"></i></div>`).join("")}</div><figcaption>${step}</figcaption></figure>`
    : v.kind === "cut"
      ? `<figure class="art cut"><div class="mc-shots">${v.items.map(([src, l]) => img(src, l)).join("")}</div><figcaption>${v.cap}</figcaption></figure>`
      : `<figure class="rows"><div class="mc-shots">${v.rows.map(r => `<div class="row">${r.map(([src, l]) => img(src, l)).join("")}</div>`).join("")}</div><figcaption>${v.cap}</figcaption></figure>`;
  const views = [shots(c.cover, c.cover.cls), ...c.sol.map(s => shots(s, s.fit)), ...c.extras.map(extra)];
  const steps = [...c.sol.map((s, i) => ({ n: pad(i + 1), label: `${s.when} · ${s.step}`, body: `<p class="mc-mute">“${s.pain}”</p><p><b>${s.k}</b> ${s.fix}</p>${s.why ? `<p class="mc-why">${s.why}</p>` : ""}` })),
    ...c.extras.map(x => ({ n: "+", label: x.step, body: `<p>${x.note}</p>` }))];
  return `<div class="mc-text">
      ${head}
      <p class="mc-lede">${c.lede}</p>
      ${facts(c.facts)}
      <h4 class="mc-k">The problem</h4>
      <p class="mc-pain">${c.pain}</p><p class="mc-meta">${c.painNote}</p>
      <h4 class="mc-k">How I solved it</h4>
      <ol class="mc-steps">${steps.map((s, i) => `<li><button data-step="${i + 1}" aria-expanded="false"><span>${s.n}</span>${s.label}<i aria-hidden="true"></i></button>
        <div class="mc-detail">${s.body}<div class="mc-inline">${views[i + 1]}</div></div></li>`).join("")}</ol>
    </div>
    <div class="mc-view">${views.map((v, i) => i ? v : v.replace("<figure class=\"", "<figure class=\"on ")).join("")}</div>`;
}
function openModal(id) {
  const p = P.find(x => x.id === id), i = P.indexOf(p), nxt = P[(i + 1) % P.length];
  const card = `<article class="mdl-card" role="dialog" aria-modal="true" aria-label="${p.title}" tabindex="-1">
      <div class="mc-pass${p.dark ? " dk" : ""}" style="${tkVars(p)};--pv:${p.pv || "#f0efeb"}">
        <button class="mdl-x" data-mclose aria-label="Close">×</button>
        <div class="mc-grid">${caseBody(p)}</div>
        <footer class="mc-stub">
          <button class="mc-home" data-mclose><span aria-hidden="true">←</span> All flights</button>
          <div class="mc-route"><span class="mc-k">Boarding stub · Seq 0${p.n}</span><b>EZA<i></i>${p.code}</b></div>
          <span class="mc-go"><button class="mc-next" data-open="${nxt.id}">Next flight: ${nxt.title} →</button></span>
        </footer>
      </div>
    </article>`;
  // switching flights keeps the backdrop and swaps the sheet
  if (mdl.hidden) mdl.innerHTML = `<div class="mdl-back" data-mclose></div>${card}`;
  else mdl.querySelector(".mdl-card").outerHTML = card;
  mdl.hidden = false; focus(id); W3 && W3.pause(true);
  const el = mdl.querySelector(".mdl-card"); el.focus({ preventScroll: true }); startTour(el);
}
function closeModal() { if (mdl.hidden) return; stopTour(); mdl.hidden = true; mdl.innerHTML = ""; focus(""); W3 && W3.pause(false); }
// the tour: the cover shows first, then the steps play in turn; picking a step stops it
let tour = null;
function stopTour() { if (tour) clearTimeout(tour.t); tour = null; }
function showStep(card, k) { // 0 is the cover, 1… the steps
  card.querySelectorAll(".mc-steps li").forEach((li, j) => { li.classList.toggle("on", j + 1 === k); li.firstElementChild.setAttribute("aria-expanded", j + 1 === k); });
  card.querySelectorAll(".mc-view > figure").forEach((f, j) => f.classList.toggle("on", j === k));
  // keep the opened step in sight inside the text column
  const box = card.querySelector(".mc-text"), li = k && card.querySelectorAll(".mc-steps li")[k - 1];
  if (li && box.scrollHeight > box.clientHeight) { const end = li.offsetTop + li.offsetHeight + 16; if (end > box.scrollTop + box.clientHeight) box.scrollTo({ top: end - box.clientHeight, behavior: reduce ? "auto" : "smooth" }); }
}
function startTour(card) {
  stopTour();
  const view = card.querySelector(".mc-view"), n = card.querySelectorAll(".mc-view > figure").length;
  if (reduce || n < 2 || !view.offsetParent) return; // phones, reduced motion and placeholders keep still
  let k = 0;
  const next = () => { k = (k + 1) % n; showStep(card, k); tour.t = setTimeout(next, k ? 8000 : 5000); };
  tour = { t: setTimeout(next, 5000) };
}
function stepModal(d) { const i = P.findIndex(x => x.id === cur); openModal(P[(i + d + P.length) % P.length].id); }

document.addEventListener("keydown", e => {
  if (lbState) { if (e.key === "Escape") closeLB(); else if (e.key === "ArrowRight") navLB(1); else if (e.key === "ArrowLeft") navLB(-1); return; }
  if (!mdl.hidden && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { stepModal(e.key === "ArrowRight" ? 1 : -1); return; }
  if (!mdl.hidden && e.key === "Tab") {
    const f = [...mdl.querySelectorAll(".mdl-card button, .mdl-card a[href]")].filter(x => x.offsetParent), i = f.indexOf(document.activeElement);
    if (e.shiftKey ? i <= 0 : i === f.length - 1) { e.preventDefault(); f[e.shiftKey ? f.length - 1 : 0].focus(); }
    return;
  }
  if (e.key === "Escape") { if (!mdl.hidden) closeModal(); else closePage(); }
});

/* ---------------- landing: a plane crosses the blue screen leaving a line; WELCOME ABOARD / EZ AIR part around it; the screen opens along the line ---------------- */
(() => {
  const el = document.querySelector(".intro"); if (!el) return;
  if (reduce || !window.gsap) { el.remove(); return; }
  const line = el.querySelector(".in-line"), plane = el.querySelector(".in-plane"), top = el.querySelector(".in-top"), bot = el.querySelector(".in-bot");
  const gap = (half, side) => parseFloat(getComputedStyle(half)[side]) || 0;   // each word starts just past the line, beyond its half's padding
  const tl = gsap.timeline({ onComplete: () => el.remove() });
  tl.to(plane, { x: () => innerWidth + 80, duration: 1.15, ease: "power2.inOut" }, .25)
    .to(line, { scaleX: 1, duration: 1.15, ease: "power2.inOut" }, .3)
    .fromTo(top.firstElementChild, { yPercent: 112, y: gap(top, "paddingBottom") }, { yPercent: 0, y: 0, duration: .8, ease: "expo.out" }, 1.45)
    .fromTo(bot.firstElementChild, { yPercent: -110, y: -gap(bot, "paddingTop") }, { yPercent: 0, y: 0, duration: .8, ease: "expo.out" }, 1.55)
    .to(line, { opacity: 0, duration: .25 }, 2.7)
    .to(top, { yPercent: -100, duration: 1, ease: "expo.inOut" }, 2.7)
    .to(bot, { yPercent: 100, duration: 1, ease: "expo.inOut" }, 2.7);
  const skip = () => tl.progress(1);
  el.addEventListener("click", skip); addEventListener("keydown", skip, { once: true });
})();

/* ---------------- start ---------------- */
const wb = st.querySelector(".wb");
W3 && W3.mount(wb.querySelector(".w-slot"), wb.clientHeight);
const h = location.hash.slice(1);
if (h === "wallet" || h === "id") openPage(h);
</script>
